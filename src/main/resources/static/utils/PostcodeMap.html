<!DOCTYPE html>
<html>
<head>
</head>
<body>
<!-- HELLO DAUM! -->

<!-- iOS에서는 position:fixed 버그가 있음, 적용하는 사이트에 맞게 position:absolute 등을 이용하여 top,left값 조정 필요 -->
<div id="layer" style="display:block;position:fixed;overflow:hidden;z-index:1;-webkit-overflow-scrolling:touch;"></div>

<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

<script>
    window.addEventListener("message", onReceivedPostMessage, false);

    function onReceivedPostMessage(event){
        var action = event.data.action;
        var params = event.data.params;
        console.log("onReceivedPostMessage "+event);
    }

    function onReceivedActivityMessageViaJavascriptInterface(json){
        var data = JSON.parse(json);
        var action = data.action;
        var params = data.params;
        console.log("onReceivedActivityMessageViaJavascriptInterface "+event);
    }

    var element_layer = document.getElementById('layer');

    function execDaumPostcode() {
        new daum.Postcode({
            oncomplete: function(data) {
                var fullRoadAddr = data.address;
                var extraAddr = '';
                var bcode = data.bcode;
                var sigungu = data.sigungu;

                if(data.addressType === 'R'){
                    if(data.bname !== ''){
                        extraAddr += data.bname;
                    }
                    if(data.buildingName !== ''){
                        extraAddr += (extraAddr !== '' ? ', ' + data.buildingName : data.buildingName);
                    }
                    fullRoadAddr += (extraAddr !== '' ? ' ('+ extraAddr +')' : '');
                }

                var extraRoadAddr = '';

                if(data.bname !== '' && /[동|로|가]$/g.test(data.bname)){
                    extraRoadAddr += data.bname;
                }

                if(data.buildingName !== '' && data.apartment === 'Y'){
                   extraRoadAddr += (extraRoadAddr !== '' ? ', ' + data.buildingName : data.buildingName);
                }

                if(extraRoadAddr !== ''){
                    extraRoadAddr = ' (' + extraRoadAddr + ')';
                }

                console.log("Full Road Address: " + fullRoadAddr);
                console.log("sigungu: " + sigungu);

                window.Android.processDATA(fullRoadAddr, sigungu);
            },
            width : '100%',
            height : '100%'
        }).embed(element_layer);

        element_layer.style.display = 'block';
        initLayerPosition();
    }

    function initLayerPosition(){
        var width = (window.innerWidth || document.documentElement.clientWidth);
        var height = (window.innerHeight || document.documentElement.clientHeight);
        var borderWidth = 5;

        element_layer.style.width = width + 'px';
        element_layer.style.height = height + 'px';
        element_layer.style.border = borderWidth + 'px solid';
        element_layer.style.left = (((window.innerWidth || document.documentElement.clientWidth) - width)/2 - borderWidth) + 'px';
        element_layer.style.top = (((window.innerHeight || document.documentElement.clientHeight) - height)/2 - borderWidth) + 'px';
    }

    // ✅ 추가된 부분: 페이지 로드되면 자동 실행
    window.onload = function() {
        execDaumPostcode();
    }
</script>

</body>
</html>
